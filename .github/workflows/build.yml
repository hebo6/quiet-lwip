name: Build

on:
  push:
    branches: [ master ]
    tags:
      - "*"
  workflow_dispatch:

jobs:
  build-linux_x64:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y libliquid-dev libfec-dev libjansson-dev libsndfile1-dev portaudio19-dev

      - name: Install libquiet dependencies
        run: |
          curl -fsSL -o quiet-linux-x86_64.zip \
            https://github.com/hebo6/quiet/releases/latest/download/quiet-linux-x86_64.zip
          unzip quiet-linux-x86_64.zip
          sudo cp -r quiet-linux-x86_64/lib/libquiet.* /usr/local/lib/
          sudo cp -r quiet-linux-x86_64/include/* /usr/local/include/
          sudo ldconfig

      - name: Build and install
        run: |
          cmake -S . -B build -DCMAKE_INSTALL_PREFIX=$PWD/dist
          cmake --build build --target all examples
          cmake --install build
          cp -rT build/bin dist/bin

      - name: Bundle shared libraries
        run: |
          sudo apt-get install -y patchelf

          LIB_PATTERN='libliquid|libjansson|libcorrect|libfec|libportaudio|libquiet|libfftw3'

          bundle_deps() {
            local dir="$1"
            [ -d "$dir" ] || return
            while true; do
              new_found=0
              for file in "$dir"/*; do
                [ -f "$file" ] || continue
                for lib in $(ldd "$file" 2>/dev/null | grep -E "$LIB_PATTERN" | awk '{print $3}'); do
                  if [ -f "$lib" ] && [ ! -f "$dir/$(basename "$lib")" ]; then
                    cp "$lib" "$dir/"
                    new_found=1
                  fi
                done
              done
              [ "$new_found" -eq 0 ] && break
            done
          }

          bundle_deps dist/lib

          # 让 bin/ 里的可执行文件从相邻的 lib/ 查找 .so，产物自包含
          for f in dist/bin/*; do
            [ -f "$f" ] && [ -x "$f" ] || continue
            patchelf --set-rpath '$ORIGIN/../lib' "$f"
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: quiet-lwip-linux-x86_64
          path: dist/

  release:
    runs-on: ubuntu-latest
    if: github.ref_type == 'tag'
    needs:
      - build-linux_x64
    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
      - name: zip
        run: |
          for i in */; do
          zip -r "${i%/}.zip" "$i"
          done
      - name: release
        uses: softprops/action-gh-release@v2
        with:
          files: "*.zip"
          fail_on_unmatched_files: true
