name: Build

on:
  push:
    branches: [ master ]
    tags:
      - "*"
  workflow_dispatch:

jobs:
  build-linux_x64:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y libliquid-dev libfec-dev libjansson-dev libsndfile1-dev portaudio19-dev

      - name: Install libquiet dependencies
        run: |
          curl -fsSL -o quiet-linux-x86_64.zip \
            https://github.com/hebo6/quiet/releases/latest/download/quiet-linux-x86_64.zip
          unzip quiet-linux-x86_64.zip
          sudo cp -r quiet-linux-x86_64/lib/libquiet.* /usr/local/lib/
          sudo cp -r quiet-linux-x86_64/include/* /usr/local/include/
          sudo ldconfig

      - name: Build and install
        run: |
          cmake -S . -B build -DCMAKE_INSTALL_PREFIX=$PWD/dist
          cmake --build build --target all examples
          cmake --install build
          cp -rT build/bin dist/bin

      - name: Bundle shared libraries
        run: |
          sudo apt-get install -y patchelf

          LIB_PATTERN='libliquid|libjansson|libcorrect|libfec|libportaudio|libquiet|libfftw3'

          bundle_deps() {
            local dir="$1"
            [ -d "$dir" ] || return
            while true; do
              new_found=0
              for file in "$dir"/*; do
                [ -f "$file" ] || continue
                for lib in $(ldd "$file" 2>/dev/null | grep -E "$LIB_PATTERN" | awk '{print $3}'); do
                  if [ -f "$lib" ] && [ ! -f "$dir/$(basename "$lib")" ]; then
                    cp "$lib" "$dir/"
                    new_found=1
                  fi
                done
              done
              [ "$new_found" -eq 0 ] && break
            done
          }

          bundle_deps dist/lib

          # 让产物自包含：bin 从 ../lib 查找，lib 里的 .so 互相从 $ORIGIN 查找
          for f in dist/bin/*; do
            [ -f "$f" ] && [ -x "$f" ] || continue
            patchelf --set-rpath '$ORIGIN/../lib' "$f"
          done
          for f in dist/lib/*.so*; do
            [ -f "$f" ] || continue
            patchelf --set-rpath '$ORIGIN' "$f" 2>/dev/null || true
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: quiet-lwip-linux-x86_64
          path: dist/

  build-android-arm64-v8a:
    runs-on: ubuntu-latest
    env:
      ABI: arm64-v8a
      API: "24"

    steps:
      - uses: actions/checkout@v4

      - name: Setup Android NDK
        id: android-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c

      - name: Install build tools
        run: |
          sudo apt update
          sudo apt install -y cmake build-essential unzip curl

      - name: Download libquiet Android release
        run: |
          curl -fsSL -o quiet-android-arm64-v8a.zip \
            https://github.com/hebo6/quiet/releases/latest/download/quiet-android-arm64-v8a.zip
          unzip -q quiet-android-arm64-v8a.zip
          mkdir -p prefix
          cp -r quiet-android-arm64-v8a/include prefix/
          cp -r quiet-android-arm64-v8a/lib prefix/

      - name: Cross-compile quiet-lwip
        env:
          ANDROID_NDK_ROOT: ${{ steps.android-ndk.outputs.ndk-path }}
        run: |
          set -euxo pipefail
          PREFIX=$PWD/prefix
          cmake -S . -B build-android \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_ROOT/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=$ABI \
            -DANDROID_PLATFORM=android-$API \
            -DCMAKE_FIND_ROOT_PATH=$PREFIX \
            -DCMAKE_FIND_ROOT_PATH_MODE_LIBRARY=BOTH \
            -DCMAKE_FIND_ROOT_PATH_MODE_INCLUDE=BOTH \
            -DCMAKE_SHARED_LINKER_FLAGS="-L$PREFIX/lib"
          cmake --build build-android --target quiet_lwip_shared -j$(nproc)

      - name: Assemble Android dist
        run: |
          set -euxo pipefail
          DIST=dist/android/$ABI
          mkdir -p $DIST/lib $DIST/include/quiet-lwip
          cp build-android/lib/libquiet_lwip.so $DIST/lib/
          cp include/quiet-lwip.h $DIST/include/
          cp include/quiet-lwip/lwip-socket.h $DIST/include/quiet-lwip/
          cp -r include/lwip $DIST/include/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: quiet-lwip-android-arm64-v8a
          path: dist/android/arm64-v8a/

  release:
    runs-on: ubuntu-latest
    needs:
      - build-linux_x64
      - build-android-arm64-v8a
    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
      - name: zip
        run: |
          for i in */; do
          zip -r "${i%/}.zip" "$i"
          done
      - name: release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'nightly' }}
          files: "*.zip"
          fail_on_unmatched_files: true
          make_latest: "true"
